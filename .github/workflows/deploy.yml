# Build → push → deploy pipeline scaffolded by hatchkit, pruned to the
# client-only surface this repo actually has.
#
#   1. verify        — install, typecheck, unit tests, production build,
#                      and a static-export build plus a shape check on its
#                      output. NEXT_FILE_EXPORT=1 is a recorded binding
#                      decision (no route may use a dynamic segment, no
#                      server may be added), so CI guards it rather than
#                      discovering a break at packaging time.
#   2. e2e           — Playwright smoke run. playwright.config.ts's
#                      webServer builds and serves the app on 6337; there
#                      is no database, cache or object store to start.
#   3. build-client  — build ./Dockerfile, push to GHCR as
#                      `ghcr.io/<owner>/<repo>-client:master` + `:<sha>`.
#   4. deploy        — once the image is pushed, tell Coolify to redeploy
#                      via its API (webhook fallback).
#
# Required repo secrets (hatchkit sets these via `gh secret set` during
# adopt / create; rotate via the GitHub UI / `gh`):
#   COOLIFY_BASE_URL      — base URL of the Coolify install
#                           (e.g. https://coolify.example.com)
#   COOLIFY_RESOURCE_UUID — uuid of the Coolify application resource to
#                           redeploy
#   COOLIFY_API_TOKEN     — bearer token for the Coolify API
#   COOLIFY_WEBHOOK_URL   — (optional fallback) per-app deploy webhook,
#                           used only when COOLIFY_BASE_URL is unset
#
# No dotenvx BuildKit secret any more: .env.production carries no value
# the app reads, and requiring the key made `docker build .` impossible
# from a clean checkout. DOTENV_PRIVATE_KEY_PRODUCTION is now unused.
#
# GHCR auth uses the workflow's built-in GITHUB_TOKEN. For Coolify to
# pull a private package, SSH into the Coolify host once and run
# `docker login ghcr.io` — Coolify reads ~/.docker/config.json
# automatically. See:
# https://coolify.io/docs/knowledge-base/custom-docker-registry
name: build-and-deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: Static export must keep building
        run: NEXT_FILE_EXPORT=1 pnpm run build
      # "It built" is not "it runs": a nested page under assetPrefix "./"
      # builds cleanly and then 404s every one of its own chunks.
      - name: Static export must stay runnable
        run: node packages/client/scripts/check-export.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # pnpm-workspace.yaml's allowBuilds allowlist deliberately omits
      # playwright, so `pnpm install` never downloads browsers.
      - run: pnpm exec playwright install --with-deps chromium
      # No separate build step: playwright.config.ts's webServer runs
      # `pnpm run build:client` itself, which is what keeps a bare
      # `pnpm exec playwright test` working on a clean checkout too.
      - name: Run E2E tests
        run: pnpm exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-client:
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-client:master
            ghcr.io/${{ github.repository }}-client:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-client]
    steps:
      - name: Deploy via Coolify API
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        if: env.COOLIFY_BASE_URL != '' && env.COOLIFY_RESOURCE_UUID != ''
        run: |
          curl -fsSL -X POST \
            "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_RESOURCE_UUID&force=true" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN"

      - name: Deploy via webhook (fallback)
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        if: env.COOLIFY_BASE_URL == '' && env.COOLIFY_WEBHOOK_URL != ''
        run: curl -fsSL "$COOLIFY_WEBHOOK_URL"
