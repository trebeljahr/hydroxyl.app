# Candidate builds never move a live image tag or queue a deployment.
# First adoption requires the reviewed provider rollout and exact image digest.
name: Build & Verify Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build a candidate or verify a release already deployed
        type: choice
        options: [build, verify]
        default: build
      target_sha:
        description: Full commit SHA required for read-only release verification
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: image-release-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    if: github.repository == 'trebeljahr/chemistry-sketcher' && github.ref == 'refs/heads/main' && inputs.operation != 'verify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/release.test.mjs
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      # The export is built WITH Plausible settings, so that check-export.mjs
      # can prove it still ships no analytics (decision 136). The host is
      # reserved (.invalid) and never contacted.
      - name: Static export must keep building
        run: NEXT_FILE_EXPORT=1 pnpm run build
        env:
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: chemistry.trebeljahr.com
          NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL: https://plausible.export-check.invalid/js/script.js
      # "It built" is not "it runs": a nested page under assetPrefix "./"
      # builds cleanly and then 404s every one of its own chunks.
      - name: Static export must stay runnable
        run: node packages/client/scripts/check-export.mjs
        env:
          NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL: https://plausible.export-check.invalid/js/script.js

  e2e:
    if: github.repository == 'trebeljahr/chemistry-sketcher' && github.ref == 'refs/heads/main' && inputs.operation != 'verify'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # pnpm-workspace.yaml's allowBuilds allowlist deliberately omits
      # playwright, so `pnpm install` never downloads browsers.
      - run: pnpm exec playwright install --with-deps chromium
      # No separate build step: playwright.config.ts's webServer runs
      # `pnpm run build:client` itself, which is what keeps a bare
      # `pnpm exec playwright test` working on a clean checkout too.
      - name: Run E2E tests
        run: pnpm exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    if: github.repository == 'trebeljahr/chemistry-sketcher' && github.ref == 'refs/heads/main' && inputs.operation != 'verify'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/release.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trebeljahr/chemistry-sketcher-client
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=site-release
          cache-to: type=gha,mode=max,scope=site-release
          platforms: linux/amd64
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL=${{ vars.NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL }}

      - name: Record immutable release identity
        env:
          IMAGE: ghcr.io/trebeljahr/chemistry-sketcher-client
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const { GITHUB_SHA: commit, IMAGE: image, IMAGE_DIGEST: digest } = process.env;
          if (!/^[a-f0-9]{40}$/.test(commit) || !/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error('Missing full release identity.');
          writeFileSync('release.json', JSON.stringify({ commit, image, digest, reference: `${image}@${digest}` }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.json
          if-no-files-found: error

  verify:
    if: github.repository == 'trebeljahr/chemistry-sketcher' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the serving commit without deploying
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: node scripts/verify-release.mjs "$EXPECTED_SHA"
