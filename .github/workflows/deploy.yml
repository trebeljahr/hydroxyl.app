# Build → push → deploy pipeline scaffolded by hatchkit, pruned to the
# client-only surface this repo actually has.
#
#   1. verify        — install, typecheck, unit tests, production build,
#                      and a static-export build plus a shape check on its
#                      output. NEXT_FILE_EXPORT=1 is a recorded binding
#                      decision (no route may use a dynamic segment, no
#                      server may be added), so CI guards it rather than
#                      discovering a break at packaging time.
#   2. e2e           — Playwright smoke run. playwright.config.ts's
#                      webServer builds and serves the app on 6337; there
#                      is no database, cache or object store to start.
#   3. build-client  — build ./Dockerfile, push to GHCR as
#                      `ghcr.io/<owner>/<repo>-client:main` + `:<sha>`.
#   4. deploy        — once the image is pushed, tell Coolify to redeploy
#                      via its API (webhook fallback).
#
# Required repo secrets (hatchkit sets these via `gh secret set` during
# adopt / create; rotate via the GitHub UI / `gh`):
#   COOLIFY_BASE_URL      — base URL of the Coolify install
#                           (e.g. https://coolify.example.com)
#   COOLIFY_RESOURCE_UUID — uuid of the Coolify application resource to
#                           redeploy
#   COOLIFY_API_TOKEN     — bearer token for the Coolify API
#   COOLIFY_WEBHOOK_URL   — (optional fallback) per-app deploy webhook,
#                           used only when COOLIFY_BASE_URL is unset
#
# No dotenvx BuildKit secret any more: .env.production carries no value
# the app reads, and requiring the key made `docker build .` impossible
# from a clean checkout. DOTENV_PRIVATE_KEY_PRODUCTION is now unused.
#
# GHCR auth uses the workflow's built-in GITHUB_TOKEN. For Coolify to
# pull a private package, SSH into the Coolify host once and run
# `docker login ghcr.io` — Coolify reads ~/.docker/config.json
# automatically. See:
# https://coolify.io/docs/knowledge-base/custom-docker-registry
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      # The export is built WITH Plausible settings, so that check-export.mjs
      # can prove it still ships no analytics (decision 136). The host is
      # reserved (.invalid) and never contacted.
      - name: Static export must keep building
        run: NEXT_FILE_EXPORT=1 pnpm run build
        env:
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: chemistry.trebeljahr.com
          NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL: https://plausible.export-check.invalid/js/script.js
      # "It built" is not "it runs": a nested page under assetPrefix "./"
      # builds cleanly and then 404s every one of its own chunks.
      - name: Static export must stay runnable
        run: node packages/client/scripts/check-export.mjs
        env:
          NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL: https://plausible.export-check.invalid/js/script.js

  e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # pnpm-workspace.yaml's allowBuilds allowlist deliberately omits
      # playwright, so `pnpm install` never downloads browsers.
      - run: pnpm exec playwright install --with-deps chromium
      # No separate build step: playwright.config.ts's webServer runs
      # `pnpm run build:client` itself, which is what keeps a bare
      # `pnpm exec playwright test` working on a clean checkout too.
      - name: Run E2E tests
        run: pnpm exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-client:
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Plausible, cookie-less pageviews (decisions 136 and 170). Repo
          # VARIABLES, not secrets: both values are in every page anyway.
          # Unset, they arrive empty and the site loads no analytics.
          #   gh variable set NEXT_PUBLIC_PLAUSIBLE_DOMAIN --body chemistry.trebeljahr.com
          #   gh variable set NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL --body https://<plausible host>/js/script.js
          build-args: |
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL=${{ vars.NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL }}
          tags: |
            ghcr.io/${{ github.repository }}-client:main
            ghcr.io/${{ github.repository }}-client:${{ github.sha }}

  deploy:
    if: vars.CHEMISTRY_IMAGE_ROLLOUT_READY == 'true'
    runs-on: ubuntu-latest
    needs: [build-client]
    steps:
      # Enable only after the image app, probe, and deploy credentials are
      # verified. A first push must never redeploy a legacy Compose resource.
      - name: Queue exact Coolify application
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${COOLIFY_BASE_URL:?COOLIFY_BASE_URL is required}"
          : "${COOLIFY_RESOURCE_UUID:?COOLIFY_RESOURCE_UUID is required}"
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN is required}"
          application=$(curl -fsS "$COOLIFY_BASE_URL/api/v1/applications/$COOLIFY_RESOURCE_UUID" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN")
          if ! jq -e --arg uuid "$COOLIFY_RESOURCE_UUID" \
            --arg image "ghcr.io/${GITHUB_REPOSITORY,,}-client" \
            '.uuid == $uuid and .docker_registry_image_name == $image and .ports_exposes == "6337"' \
            >/dev/null <<<"$application"; then
            echo "::error::Configured Coolify resource is not the expected image app on port 6337."
            exit 1
          fi
          curl -fsS -X PATCH "$COOLIFY_BASE_URL/api/v1/applications/$COOLIFY_RESOURCE_UUID" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg tag "$GITHUB_SHA" '{docker_registry_image_tag: $tag}')" \
            >/dev/null
          response=$(curl -fsS -G "$COOLIFY_BASE_URL/api/v1/deploy" \
            --data-urlencode "uuid=$COOLIFY_RESOURCE_UUID" \
            --data-urlencode 'force=true' \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN")
          if ! jq -e '.deployments | type == "array" and any(.[]; .deployment_uuid | type == "string" and length > 0)' \
            >/dev/null <<<"$response"; then
            echo "::error::Coolify did not return a queued deployment UUID for the configured app."
            exit 1
          fi
          echo "Coolify queued deployment for $COOLIFY_RESOURCE_UUID"
