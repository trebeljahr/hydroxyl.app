# Build & Release for the hosted site (decision 257, scripts/WORKER-RELEASE.md).
#
# A build exports the web flavour (NEXT_FILE_EXPORT=web), carries the hashed
# chunks of the releases still live, and UPLOADS the result as a version of
# the assets-only Worker `chemistry-sketcher-client`. An upload is never live:
# activation is the deploy job, so no visitor gets a page whose chunks are
# still uploading (measured on the canary: seconds of 404s otherwise).
#
# CHEMISTRY_SKETCHER_ROLLOUT_MODE: unset/off, manual, or automatic.
#   automatic  a green push to main uploads, activates and verifies.
#   manual     a push only uploads; dispatch `deploy` with the commit to go live.
# Dispatching `deploy` with an earlier commit is the rollback, while that
# commit's version is among the Worker's last 100.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build, deploy an uploaded release, or verify the live one
        type: choice
        options: [build, deploy, verify]
        default: build
      target_sha:
        description: Full commit SHA required for deploy or verify
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: site-release-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Pinned. The Worker config's guard rails are in check-web-export.mjs.
  WRANGLER_VERSION: 4.145.0

jobs:
  test:
    if: github.repository == 'trebeljahr/hydroxyl.app' && github.ref == 'refs/heads/main' && inputs.operation != 'verify' && inputs.operation != 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/release.test.mjs scripts/worker-release.test.mjs
      - run: pnpm run typecheck
      - run: pnpm run test
      # The web export (what the Worker serves) and its shape; the release
      # build job repeats this with the chunk carry and the release identity.
      - run: pnpm run build
      - run: node packages/client/scripts/check-web-export.mjs
      # The export is built WITH Plausible settings, so that check-export.mjs
      # can prove it still ships no analytics (decision 136). The host is
      # reserved (.invalid) and never contacted.
      - name: Static export must keep building
        run: NEXT_FILE_EXPORT=1 pnpm run build
        env:
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: hydroxyl.app
          NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL: https://plausible.export-check.invalid/js/script.js
      # "It built" is not "it runs": a nested page under assetPrefix "./"
      # builds cleanly and then 404s every one of its own chunks.
      - name: Static export must stay runnable
        run: node packages/client/scripts/check-export.mjs
        env:
          NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL: https://plausible.export-check.invalid/js/script.js

  e2e:
    if: github.repository == 'trebeljahr/hydroxyl.app' && github.ref == 'refs/heads/main' && inputs.operation != 'verify' && inputs.operation != 'deploy'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # pnpm-workspace.yaml's allowBuilds allowlist deliberately omits
      # playwright, so `pnpm install` never downloads browsers.
      - run: pnpm exec playwright install --with-deps chromium
      # No separate build step: playwright.config.ts's webServer runs
      # `pnpm run build:web` and serves it with `wrangler dev`, what
      # production serves, which also keeps a bare `pnpm exec playwright
      # test` working on a clean checkout.
      - name: Run E2E tests
        run: pnpm exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
    if: github.repository == 'trebeljahr/hydroxyl.app' && github.ref == 'refs/heads/main' && inputs.operation != 'verify' && inputs.operation != 'deploy'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # Plausible (decisions 136 and 170): NEXT_PUBLIC_* is inlined at build
      # time, and the copies in packages/client/.env.production are dotenvx
      # ciphertext this job has no key for. Set-but-empty outranks that file,
      # so no repository variables means no analytics.
      - name: Export the web build
        run: pnpm run build:web
        env:
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
          NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL }}
      - name: Write the release identity
        run: node scripts/write-version.mjs packages/client/out "$GITHUB_SHA"
      # A Worker version serves only its own files. The live site's
      # /release-assets.json names the hashed files of the releases it holds;
      # the two newest are downloaded into this upload so their open tabs keep
      # loading chunks. ReleaseLifetime reloads any older tab after saving.
      # --require-previous: the live Worker always has a manifest, so a
      # missing or unreachable one is a failed run to retry, never a silent
      # upload that strands every open tab.
      - name: Carry the live releases' chunks
        run: node packages/client/scripts/carry-static.mjs --site https://hydroxyl.app --out packages/client/out --release "$GITHUB_SHA" --keep 2 --require-previous
      - name: Write the release list ReleaseLifetime reads
        run: node packages/client/scripts/write-releases.mjs packages/client/out
      - name: Check the upload's shape and the Workers Free limits
        run: node packages/client/scripts/check-web-export.mjs --release "$GITHUB_SHA"
      - name: Upload the version without activating it
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" versions upload --tag "$GITHUB_SHA" --message "build ${GITHUB_SHA::12} run ${GITHUB_RUN_ID}"
          version_id=$(node -e '
            const lines = require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n");
            const upload = lines.map((line) => JSON.parse(line)).find((entry) => entry.type === "version-upload");
            if (!/^[0-9a-f-]{36}$/.test(upload?.version_id ?? "")) throw new Error("wrangler reported no version id");
            console.log(upload.version_id);
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "Uploaded $version_id for $GITHUB_SHA; not live until the deploy job."
      - name: Record the release identity
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          printf '{"commit":"%s","worker":"chemistry-sketcher-client","version_id":"%s"}\n' "$GITHUB_SHA" "$VERSION_ID" > release.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error

  verify:
    if: github.repository == 'trebeljahr/hydroxyl.app' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the serving commit without deploying
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: node scripts/verify-release.mjs "$EXPECTED_SHA"

  deploy:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.repository == 'trebeljahr/hydroxyl.app' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.CHEMISTRY_SKETCHER_ROLLOUT_MODE == 'automatic' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Activates the version, then requires every origin's /version.json and
      # homepage to name the commit. On a failed check it puts the previously
      # live version back and the job still fails.
      - name: Activate and verify the release
        env:
          TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha }}
          VERSION_ID: ${{ github.event_name == 'push' && needs.build.outputs.version_id || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/worker-release.mjs deploy "$TARGET_SHA" "$VERSION_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollout.json
          if-no-files-found: warn
