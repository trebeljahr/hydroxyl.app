# Production Docker Compose — deploy as a Coolify Service Stack.
# Coolify auto-detects ${VAR_NAME} syntax and creates UI fields for each.
# Do NOT expose ports here — Coolify's Traefik handles external routing.

services:
  client:
    image: ${CLIENT_IMAGE:-ghcr.io/trebeljahr/chemistry-sketcher-client:master}
    environment:
      # Pin the client port explicitly so a Coolify app-level PORT cannot
      # bleed into this service. Must stay in step with ENV PORT / EXPOSE
      # / HEALTHCHECK in ./Dockerfile.
      PORT: "6337"
    restart: unless-stopped

